# ===============================================
# Cau hinh ZMK cho Macropad15 (Pro Micro RP2040)
# ===============================================

# ----- 3 nut xoay EC11 -----
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ----- OLED SSD1306 128x64 tren I2C0 (SDA = GP20/D14, SCL = GP21/D10) -----
CONFIG_ZMK_DISPLAY=y
# Man hinh custom: ten layer + phim vua bam (module src/status_screen.c)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Tu tat man hinh khi khong hoat dong (theo OLED_TIMEOUT cua QMK)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ----- USB trung khop firmware QMK/Vial -----
CONFIG_USB_DEVICE_VID=0xC1A0
CONFIG_USB_DEVICE_PID=0x0015
CONFIG_USB_DEVICE_MANUFACTURER="chipgenni"
CONFIG_USB_DEVICE_PRODUCT="Macropad15"

# ----- NKRO (giong "nkro": true trong keyboard.json) -----
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ----- LED NUM/CAPS de hien len man hinh OLED -----
CONFIG_ZMK_HID_INDICATORS=y

# ----- Tham so behavior (co the sua trong Kconfig goc) -----
CONFIG_MACROPAD15_TAPPING_TERM_MS=200
CONFIG_MACROPAD15_NOKIA_MULTITAP_MS=600
